[project]
name = "sentriqai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "govind.ss", email = "govind.ss@pitsolutions.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
sentriqai = "sentriqai:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
